<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Faculty Online Notice Board</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#003366",
                        "accent-gold": "#D4AF37",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1923",
                    },
                    fontFamily: { "display": ["Public Sans", "sans-serif"] },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-display">
    <header class="sticky top-0 z-50 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-4">
        <div class="max-w-[1200px] mx-auto flex items-center justify-between">
            <a href="{% url 'home' %}" class="flex items-center gap-4 text-decoration-none">
                <span class="material-symbols-outlined text-4xl text-primary dark:text-accent-gold">account_balance</span>
                <h1 class="text-primary dark:text-white text-xl md:text-2xl font-bold">Faculty Online Notice Board</h1>
            </a>
            <div class="flex items-center gap-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'staff_dashboard' %}" class="hidden md:flex items-center justify-center rounded-lg h-10 px-5 bg-primary text-white text-sm font-bold">Dashboard</a>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="flex items-center gap-2 px-4 py-2 text-sm font-bold text-slate-600 hover:text-red-600 transition-colors">
                            <span class="material-symbols-outlined text-xl">logout</span>
                            <span>Logout</span>
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="hidden md:flex items-center justify-center rounded-lg h-10 px-5 bg-primary text-white text-sm font-bold">Admin Login</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="max-w-[1200px] mx-auto w-full px-4 md:px-10 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-20 border-t border-slate-200 dark:border-slate-800 py-10 px-4 bg-white dark:bg-slate-900 text-center">
        <p class="text-xs text-slate-400">© 2026 Faculty Online Notice Board System. All Rights Reserved.</p>
    </footer>
</body>
</html>
