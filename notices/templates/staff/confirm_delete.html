{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg p-4 rounded-4 text-center">
            <div class="mb-3 text-danger">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
                  <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                </svg>
            </div>
            
            <h2 class="fw-bold mb-3">Confirm Deletion</h2>
            <p class="text-muted mb-4">
                Are you sure you want to delete the notice: <br>
                <strong class="text-dark">"{{ notice.title }}"</strong>?<br>
                This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger btn-lg fw-bold">YES, DELETE NOTICE</button>
                    <a href="{% url 'staff_dashboard' %}" class="btn btn-light btn-lg">Cancel and Go Back</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
